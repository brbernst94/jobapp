<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobApp Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { width: 320px; background: #fff; color: #111827; }

    .header {
      background: #4F46E5;
      color: #fff;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.8; }
    .logo { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:18px; }

    .section { padding: 12px 16px; border-bottom: 1px solid #F3F4F6; }
    .section h2 { font-size: 11px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

    .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .status-label { font-size: 13px; color: #374151; }
    .status-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
    .badge-blue { background: #EEF2FF; color: #4338CA; }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-amber { background: #FEF3C7; color: #92400E; }
    .badge-red { background: #FEE2E2; color: #991B1B; }
    .badge-gray { background: #F3F4F6; color: #374151; }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn-primary { background: #4F46E5; color: #fff; }
    .btn-primary:hover { background: #4338CA; }
    .btn-secondary { background: #F9FAFB; color: #374151; border: 1px solid #E5E7EB; }
    .btn-secondary:hover { background: #F3F4F6; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer { padding: 12px 16px; display: flex; gap: 8px; }

    .last-sync { font-size: 11px; color: #9CA3AF; text-align: center; padding: 6px; }

    .activity-item { padding: 6px 0; border-bottom: 1px solid #F9FAFB; }
    .activity-item:last-child { border-bottom: none; }
    .activity-company { font-size: 13px; font-weight: 600; color: #111827; }
    .activity-status { font-size: 11px; color: #6B7280; margin-top: 1px; }

    .empty { text-align: center; color: #9CA3AF; font-size: 12px; padding: 12px 0; }

    #auth-section { padding: 16px; }
    .signin-text { font-size: 13px; color: #6B7280; margin-bottom: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✉</div>
    <div>
      <h1>JobApp Tracker</h1>
      <p>Patrick Selner — Graphic Designer</p>
    </div>
  </div>

  <div id="auth-section" style="display:none;">
    <p class="signin-text">Sign in with Gmail to start tracking application responses automatically.</p>
    <button class="btn btn-primary" id="signin-btn">Sign in with Gmail</button>
  </div>

  <div id="main-section" style="display:none;">
    <div class="section">
      <h2>Application Status</h2>
      <div id="stats-container">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <div class="section">
      <h2>Recent Activity</h2>
      <div id="activity-container">
        <div class="empty">No recent email activity</div>
      </div>
    </div>

    <div class="last-sync" id="last-sync-text">Last synced: never</div>

    <div class="footer">
      <button class="btn btn-primary" id="sync-btn" style="flex:1;">Sync Now</button>
      <button class="btn btn-secondary" id="open-dashboard-btn" style="flex:1;">Open Dashboard</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
